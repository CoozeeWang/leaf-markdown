[package]
name = "leaf"
version = "1.0.2"
edition = "2021"
license = "MIT"
default-run = "leaf"

[[bin]]
name = "leaf"
path = "src/main.rs"

[[bin]]
name = "leaf-mcp-adapter"
path = "src/bin/leaf-mcp-adapter.rs"

[[bin]]
name = "leaf-update-helper"
path = "src/bin/leaf-update-helper.rs"

[features]
# Enables a local CDP connection only in native CI probe builds.
native-smoke = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
# Moves a replaced document into the system trash so a confirmed overwrite
# stays recoverable instead of destroying the original outright.
trash = "5"
sys-locale = "0.3.2"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util", "process"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
getrandom = "=0.3.4"
pulldown-cmark = { version = "=0.13.0", default-features = false }
# Already locked transitive dependencies, exposed directly for native HTTPS and SemVer.
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
semver = "=1.0.28"
# Official tauri-plugin-updater 2.14.0 uses this same verifier (its wrapper is private).
minisign-verify = "=0.3.0"
base64 = "=0.22.1"
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
plist = "=1.10.1"
unicode-normalization = "=0.1.25"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_Networking_WinHttp"] }
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation"] }
