<!doctype html><html><meta charset="utf-8"><div id="app"></div><script type="module">
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const check = (condition, message) => { if (!condition) throw Error(message); };
window.startTest = async () => {
 try {
  window.isTauri = true;
  window.saveFails = false;
  window.entries = [{kind: 'draft', key: 'test', id: 'draft'}];
  window.__TAURI_INTERNALS__ = {
   metadata: {currentWindow: {label: 'document-test'}, currentWebview: {label: 'document-test'}},
   transformCallback: () => 1,
   invoke: async (cmd, args) => {
    if (cmd === 'initial_path') return '/tmp/提示检查.md';
    if (cmd === 'read_document') return '# 提示检查\n\n正文';
    if (cmd === 'recovery_list') return entries;
    if (cmd === 'recovery_retention') return 30;
    if (cmd === 'write_document' && saveFails) throw '保存失败：' + '/很长的文件夹'.repeat(100);
    if (cmd === 'rename_document') return '/tmp/' + args.name;
    return null;
   },
  };
  await import('/src/main.js');
  const {desktopSave, desktopRestore, desktopRecoveryPaused} = await import('/src/desktop.js');
  for (let i = 0; i < 100 && !document.querySelector('#saveStatus').textContent.includes('已开启'); i++) await wait(30);
  const text = document.querySelector('#saveStatus'), recovery = document.querySelector('#recoveryNotice');
  const notice = document.querySelector('#statusNotice'), close = document.querySelector('#dismissStatus');
  check(text.textContent.includes('已开启'), 'opening status missing');
  check(!document.querySelector('.topbar #saveStatus'), 'message still under filename');
  await wait(4100);
  check(text.hidden && !recovery.hidden, 'success did not expire to recovery');
  recovery.parentElement.querySelector('#dismissStatus').click();
  window.dispatchEvent(new Event('focus')); await wait(100);
  check(notice.hidden && entries.length === 1, 'dismissal deleted recovery or focus reopened it');
  saveFails = true; await desktopSave();
  await wait(4100);
  check(text.textContent.includes('尚未保存'), 'save error auto-expired');
  const messageBox = notice.getBoundingClientRect(), closeBox = close.getBoundingClientRect();
  check(messageBox.top >= document.querySelector('.document-area').getBoundingClientRect().bottom - 1, 'message covers document');
  check(closeBox.right <= innerWidth && closeBox.bottom <= innerHeight, 'close outside window');
  check(text.getBoundingClientRect().height <= innerHeight * .25 + 1, 'long error is not constrained');
  close.click(); check(notice.hidden, 'error cannot close');
  await desktopRestore('# 恢复内容');
  check(text.textContent.includes('自动保存暂停'), 'restore warning missing');
  close.click(); check(desktopRecoveryPaused(), 'closing warning resumed autosave');
  saveFails = false; await desktopSave();
  check(text.textContent === '已保存' && !desktopRecoveryPaused(), 'manual save failed to resolve pause');
  document.title = 'LeafTest PASS native unified status, expiry, recovery dismissal, persistent long errors and save protection';
 } catch (error) { document.title = 'LeafTest FAIL ' + error.message; }
};
document.title = 'LeafSource';
</script></html>
