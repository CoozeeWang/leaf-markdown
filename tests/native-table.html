<!doctype html><html><meta charset="utf-8"><div id="editor"></div><script type="module">
import {createLeafEditor} from '/src/editor.js';
import '/src/style.css';
const frame=()=>new Promise(resolve=>setTimeout(resolve,100));
let runtimeError; window.addEventListener('error',event=>{runtimeError=event.message;});
try {
  const editor=createLeafEditor({parent:document.querySelector('#editor'),doc:'| 内容 |\n| --- |\n| 甲<br>乙 |\n\n正文'});
  await frame();
  document.querySelector('td .leaf-cell-preview').click();
  const input=document.querySelector('textarea[data-row="1"]');
  input.setSelectionRange(5,5);
  for(let i=0;i<4;i++) {
    input.setRangeText('',input.selectionStart-1,input.selectionEnd,'end');
    input.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'deleteContentBackward'}));
    await frame();
    if(document.activeElement!==input || input.selectionStart!==4-i) throw Error(`删除 ${i+1} 次后光标 ${input.selectionStart}, 焦点 ${document.activeElement.tagName}`);
  }
  input.setRangeText('；',input.selectionStart,input.selectionEnd,'end');
  input.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:'；'}));
  await frame();
  if(input.value!=='甲；乙'||input.selectionStart!==2) throw Error('替换分号失败');
  if(runtimeError) throw Error(runtimeError);
  document.title='LeafTest PASS: WebKit table editing';
} catch(error) {document.title='LeafTest FAIL: '+error.message;}
</script></html>
