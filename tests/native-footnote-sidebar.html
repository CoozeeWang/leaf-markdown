<!doctype html><html><meta charset="utf-8"><div id="app"></div>
<script type="module">
import {initializeLanguage} from '/src/i18n.js';
await initializeLanguage();await import('/src/main.js');
window.startTest=async()=>{
 const pause=()=>new Promise(r=>setTimeout(r,120));
 const check=(value,message)=>{if(!value)throw Error(message);};
 try {
  document.querySelector('#welcomeNewButton').click();
  const {EditorView}=await import('/node_modules/@codemirror/view/dist/index.js');
  const view=EditorView.findFromDOM(document.querySelector('#editor .cm-content'));
  const source='正文[^a]。\n\n[^a]: **粗体**、*斜体*、`code`、==高亮== 和 [链接](https://example.com)。';
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:source},selection:{anchor:0}});
  document.querySelector('#notesButton').click();await pause();
  check(document.querySelector('.note-body .tok-strong')?.textContent==='粗体','edit rendering missing');
  const mode=async name=>{document.querySelector('#readingToggle').click();document.querySelector(`[data-mode=${name}]`).click();await pause();};
  await mode('source');check(document.querySelector('.note-body').textContent.includes('**粗体**'),'source markers missing');
  await mode('reading');check(document.querySelector('.note-body strong')?.textContent==='粗体','reading formatting missing');
  check(!document.querySelector('.note-body [contenteditable=true],.note-delete'),'reading view editable');
  await mode('edit');
  const card=document.querySelector('.note-card'),note=card._noteEditor.view;
  note.dispatch({changes:{from:2,insert:'新'},selection:{anchor:3},userEvent:'input.type'});
  check(view.state.doc.toString().includes('**新粗体**'),'note edit not saved to document buffer');
  document.querySelector('#undoButton').click();check(view.state.doc.toString()===source,'note undo changed source');
  check(!card._noteEditor.value().includes('新粗体'),'note undo left stale sidebar text');
  check(document.querySelector('[data-format=highlight] svg'),'highlighter icon missing');
  document.title='LeafTest PASS native footnote sidebar modes, source preservation, shared undo and toolbar icon';
 }catch(error){document.title='LeafTest FAIL '+error.message;}
};
document.title='LeafSource';
</script></html>
