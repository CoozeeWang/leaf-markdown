<!doctype html><html><meta charset="utf-8">
<div id="editor" style="height:700px"></div>
<script type="module">
import {createLeafEditor} from '/src/editor.js';
import {imageLines} from '/src/image-list-indent.js';
import {renderPrintDocument} from '/src/print-document.js';
import {setResourceReader} from '/src/resources.js';
import '/src/style.css';
const pause=()=>new Promise(resolve=>setTimeout(resolve,120));
window.startTest=async()=>{
 try {
  setResourceReader(async()=>Array.from(new TextEncoder().encode('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80"><rect width="120" height="80" fill="#607b68"/></svg>')));
  const source='- First\n  ![photo](assets/photo.svg)\n- Second';
  const editor=createLeafEditor({parent:document.querySelector('#editor'),doc:source}),view=editor.view;
  const select=()=>{view.dispatch({selection:{anchor:editor.getValue().indexOf('![')}});view.focus();};
  // Actual WKWebView layout/keymap; key events and resource bytes are synthetic.
  const key=(value,shift=false)=>view.contentDOM.dispatchEvent(new KeyboardEvent('keydown',{key:value,code:value,shiftKey:shift,bubbles:true,cancelable:true}));
  const check=async expected=>{
   view.dispatch({selection:{anchor:view.state.doc.length}});await pause();
   const image=[...imageLines(view.state).values()][0];
   if(Boolean(image.item)!==expected)throw Error('source list membership differs');
   const line=[...document.querySelectorAll('.cm-line')].find(line=>line.querySelector('.leaf-image'));
   if(!line||line.classList.contains('cm-leaf-nested-list')!==expected)throw Error('preview indentation differs');
   const root=document.createElement('div');renderPrintDocument(root,editor.getValue(),{fallbackTitle:false});
   if(Boolean(root.querySelector('.leaf-image').closest('li'))!==expected)throw Error('reading/export membership differs');
  };
  await check(true);select();key('Tab',true);await check(false);
  const detached=editor.getValue();
  if(detached!=='- First\n\n![photo](assets/photo.svg)\n- Second')throw Error('outdent changed adjacent list text');
  editor.undo();if(editor.getValue()!==source)throw Error('outdent is not one undo');
  editor.redo();if(editor.getValue()!==detached)throw Error('redo changed source');
  select();key('Tab');await check(true);select();key('Tab',true);await check(false);
  if(editor.getValue()!==detached)throw Error('reindent/outdent did not round trip');
  document.title='LeafTest PASS WKWebView list image source/preview/export, keymap, undo/redo and reindent';
 }catch(error){document.title='LeafTest FAIL '+error.message;}
};
document.title='LeafSource';
</script></html>
