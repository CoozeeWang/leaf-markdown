name: Full platform tests (manual)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit to test'
        type: string
        required: true
        default: main
      platform:
        description: 'Platform to test; use both only when needed'
        type: choice
        options: [windows, macos, both]
        default: windows
      suite:
        description: 'Test suites to run'
        type: choice
        options: [all, browser, native, package-security]
        default: all
      artifact_id:
        description: 'Existing installer artifact ID; required for package-security'
        type: string
        default: ''
      artifact_sha256:
        description: 'Expected original artifact ZIP SHA-256; required for package-security'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: full-tests-${{ inputs.source_ref }}-${{ inputs.platform }}-${{ inputs.suite }}
  cancel-in-progress: true
jobs:
  package-security:
    if: inputs.suite == 'package-security'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download and scan the original installer artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:ARTIFACT_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'Provide an artifact ID and its expected ZIP SHA-256'
          }
          $scanDir = Join-Path $env:RUNNER_TEMP 'leaf-package-security'
          New-Item -ItemType Directory -Path $scanDir | Out-Null
          $zip = Join-Path $scanDir 'installer-artifact.zip'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"
          Invoke-WebRequest -Uri $uri -Headers @{Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'} -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ARTIFACT_SHA256.ToLowerInvariant()) { throw 'Original artifact checksum mismatch' }
          Write-Output "Original ZIP SHA-256: $actual"
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $scanDir 'unpacked')
          $installers = @(Get-ChildItem (Join-Path $scanDir 'unpacked') -Recurse -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer in the artifact' }
          $installer = $installers[0]
          $beforeHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Output "Installer SHA-256: $beforeHash"
          Get-AuthenticodeSignature $installer.FullName | Select-Object Status, StatusMessage | Format-List
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, AMEngineVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) { throw 'Defender is unavailable; no scan result' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          if ($status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)) { throw 'Defender signatures are too old' }
          $status | Select-Object AMEngineVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          $mpCmd = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$mpCmd) { $mpCmd = Get-Item "$env:ProgramFiles/Windows Defender/MpCmdRun.exe" }
          # This scans archives and ignores file exclusions without remediating files.
          # Without DisableRemediation, exit 0 may also mean malware was remediated.
          & $mpCmd.FullName -Scan -ScanType 3 -File $scanDir -DisableRemediation
          $scanExit = $LASTEXITCODE
          Write-Output "Defender custom scan exit code: $scanExit"
          if ($scanExit -ne 0) { throw 'Defender reported a detection or scan error; inspect command output' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $actual -or (Get-FileHash $installer.FullName -Algorithm SHA256).Hash -ne $beforeHash) {
            throw 'Artifact changed during the scan'
          }
          Write-Output 'Defender scan completed with no detection. This does not establish Chrome Safe Browsing clearance or installed-app acceptance.'
  frontend:
    if: inputs.suite == 'all' || inputs.suite == 'browser'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["windows-latest","macos-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run check
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  native:
    if: inputs.suite == 'all' || inputs.suite == 'native'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["windows-latest","macos-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --all-targets
        working-directory: src-tauri
      - name: Detect optional Windows native probe
        id: probe
        shell: bash
        run: |
          if [[ -f tests/windows-native-smoke.mjs ]] && grep -q '^native-smoke' src-tauri/Cargo.toml; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run desktop:build -- --no-bundle
        if: runner.os != 'Windows' || steps.probe.outputs.available != 'true'
      - run: npm run desktop:build -- --no-bundle --features native-smoke
        if: runner.os == 'Windows' && steps.probe.outputs.available == 'true'
      - name: Ensure WebView2 runtime
        if: runner.os == 'Windows' && steps.probe.outputs.available == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/webview2.exe"
          $installer = Start-Process "$env:RUNNER_TEMP/webview2.exe" -ArgumentList '/silent', '/install' -Wait -PassThru
          Write-Output "WebView2 installer exit code: $($installer.ExitCode)"
      - name: Windows native window smoke test
        if: runner.os == 'Windows' && steps.probe.outputs.available == 'true'
        timeout-minutes: 5
        run: node tests/windows-native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && steps.probe.outputs.available == 'true'
        with:
          name: windows-native-probe
          path: src-tauri/target/release/leaf.exe
          if-no-files-found: ignore
          retention-days: 3
