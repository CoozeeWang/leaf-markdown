name: Checks
on:
  push:
    branches: ['**']
    paths: &check_paths
      - '.github/workflows/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.*'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    paths: *check_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lightweight:
    # Same-repository branches already receive push checks; avoid duplicate PR runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop test prerequisites
        run: |
          # Avoid the Azure mirror that can stall release gates before tests.
          # APT still validates Ubuntu's signed package indexes and packages.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's@https\?://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
          done
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Application-link policy and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin leaf app_links::tests
      - name: Resource path confinement
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin leaf resources::tests
