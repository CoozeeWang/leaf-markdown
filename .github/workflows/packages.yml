name: Internal test packages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit to package'
        type: string
        required: true
        default: main
      platform:
        description: 'Build one installer; Mac builds should normally run locally'
        type: choice
        options: [windows, macos-arm64, macos-intel]
        default: windows
      verification_scope:
        description: 'Targeted Windows ChatGPT proxy validation skips unrelated interface, file and PDF checks'
        type: choice
        options: [standard, chatgpt-proxy, windows-updater]
        default: standard
permissions:
  contents: read
  actions: read
concurrency:
  group: packages-${{ inputs.source_ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 40
    env:
      LEAF_BUILD_TARGET: ${{ inputs.platform == 'windows' && 'x86_64-pc-windows-msvc' || inputs.platform == 'macos-intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      LEAF_BUILD_CONFIG: ${{ inputs.platform == 'windows' && 'src-tauri/tauri.windows.conf.json' || 'src-tauri/tauri.macos.conf.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LEAF_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.LEAF_BUILD_TARGET }}
          cache-on-failure: true
      - name: Record source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
        if: inputs.verification_scope == 'standard'
      - name: Targeted ChatGPT source checks
        if: inputs.verification_scope == 'chatgpt-proxy'
        run: node --test tests/ai-connections.test.js
      - name: Claude extension transport regression
        if: inputs.verification_scope == 'standard'
        run: node tests/claude-stdio-host.cjs src-tauri/src/claude_stdio.cjs
      - name: Windows trilingual interface checks
        if: inputs.platform == 'windows' && inputs.verification_scope == 'standard'
        shell: bash
        run: |
          npx playwright install chromium webkit
          npm run test:browser -- i18n-browser.mjs ai-connections-browser.mjs
      - name: Native unit tests
        if: inputs.verification_scope == 'standard'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Targeted proxy status and native tests
        if: inputs.verification_scope == 'chatgpt-proxy'
        shell: bash
        run: |
          npx playwright install chromium
          npm run test:browser -- ai-tunnel-status-browser.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin leaf tunnel -- --test-threads=1
      - name: Verify Windows official tunnel proxy
        if: inputs.platform == 'windows' && inputs.verification_scope == 'chatgpt-proxy'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows-mcp-config.ps1 -ProxyOnly -VendorOnly
      - name: Verify Windows MCP configuration and native restart
        if: inputs.platform == 'windows' && inputs.verification_scope != 'windows-updater'
        shell: pwsh
        run: |
          npm run desktop:build -- --debug --no-bundle --features native-smoke --config src-tauri/tauri.mcp-test.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Isolated MCP GUI/helper build failed' }
          ./tests/windows-mcp-config.ps1 -ProxyOnly:($env:LEAF_VERIFICATION_SCOPE -eq 'chatgpt-proxy') -SkipVendor:($env:LEAF_VERIFICATION_SCOPE -eq 'chatgpt-proxy')
          if ($LASTEXITCODE -ne 0) { throw 'Windows MCP configuration checks failed' }
        env:
          LEAF_VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
          GH_TOKEN: ${{ github.token }}
      - name: Build installer
        id: installer
        shell: bash
        run: npm run desktop:build -- --target "$LEAF_BUILD_TARGET" --config "$LEAF_BUILD_CONFIG"
      - name: Verify Windows supervised installation and recovery
        if: inputs.platform == 'windows' && inputs.verification_scope == 'windows-updater'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tests/windows-desktop-updates.ps1 -Mode SourceFixture
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin leaf-update-helper --features native-smoke
          if ($LASTEXITCODE) { throw 'Windows fixture supervisor build failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem "src-tauri/target/$env:LEAF_BUILD_TARGET/release/bundle/nsis/Leaf_$($version)_*.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer for the current product version' }
          ./tests/windows-desktop-updates.ps1 -Mode InstalledFixture -Installer $installers[0].FullName
          ./tests/windows-desktop-updates.ps1 -Mode RecoveryAudit
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.platform == 'windows' && steps.installer.outcome == 'success'
        with:
          name: Unvalidated-NSIS-${{ steps.source.outputs.sha }}
          path: src-tauri/target/${{ env.LEAF_BUILD_TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'windows' && inputs.verification_scope == 'windows-updater'
        with:
          name: Windows-updater-payload-${{ steps.source.outputs.sha }}
          path: |
            test-results/windows-updater-payload/
            test-results/windows-update-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify Windows file integration
        if: inputs.platform == 'windows' && inputs.verification_scope == 'standard'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/$env:LEAF_BUILD_TARGET/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer not found' }
          ./tests/windows-adapter-upgrade.ps1 -Installer $installer.FullName
          ./tests/windows-i18n-installer.ps1 -Installer $installer.FullName
          ./tests/document-icons-windows.ps1 -Installer $installer.FullName
      - name: Verify macOS file integration
        if: inputs.platform != 'windows'
        shell: bash
        run: node tests/document-icons-package.mjs "src-tauri/target/$LEAF_BUILD_TARGET/release/bundle/macos/Leaf.app"
      - name: Verify actual Windows PDF rendering
        if: inputs.platform == 'windows' && inputs.verification_scope == 'standard'
        shell: pwsh
        run: |
          npm run desktop:build -- --debug --no-bundle --features native-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF probe build failed' }
          python -m pip install pypdf==6.10.0
          if ($LASTEXITCODE -ne 0) { throw 'PDF validation dependency failed' }
          $env:LEAF_NATIVE_SMOKE_EXE = Join-Path $PWD 'src-tauri/target/debug/leaf.exe'
          node tests/windows-native-smoke.mjs --pdf-only
          if ($LASTEXITCODE -ne 0) { throw 'Actual Leaf PDF export failed' }
      - name: Generate checksums
        shell: bash
        run: node scripts/package-checksums.mjs "$LEAF_BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-${{ env.LEAF_BUILD_TARGET }}-${{ steps.source.outputs.sha }}
          path: test-results/packages/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && inputs.platform == 'windows' && inputs.verification_scope == 'standard'
        with:
          name: Windows-PDF-${{ steps.source.outputs.sha }}
          path: test-results/windows-pdf/
          if-no-files-found: ignore
          retention-days: 7
