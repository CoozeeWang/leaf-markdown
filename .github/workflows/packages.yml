name: Internal test packages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit to package'
        type: string
        required: true
        default: main
      platform:
        description: 'Build one installer; Mac builds should normally run locally'
        type: choice
        options: [windows, macos-arm64, macos-intel]
        default: windows
permissions:
  contents: read
concurrency:
  group: packages-${{ inputs.source_ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 40
    env:
      LEAF_BUILD_TARGET: ${{ inputs.platform == 'windows' && 'x86_64-pc-windows-msvc' || inputs.platform == 'macos-intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      LEAF_BUILD_CONFIG: ${{ inputs.platform == 'windows' && 'src-tauri/tauri.windows.conf.json' || 'src-tauri/tauri.macos.conf.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.LEAF_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.LEAF_BUILD_TARGET }}
          cache-on-failure: true
      - name: Record source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - name: Claude extension transport regression
        run: node tests/claude-stdio-host.cjs src-tauri/src/claude_stdio.cjs
      - name: Windows trilingual interface checks
        if: inputs.platform == 'windows'
        shell: bash
        run: |
          npx playwright install chromium webkit
          npm run test:browser -- i18n-browser.mjs
      - name: Native unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin leaf
      - name: Verify Windows MCP configuration and native restart
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          npm run desktop:build -- --debug --no-bundle --features native-smoke --config src-tauri/tauri.mcp-test.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Isolated MCP GUI/helper build failed' }
          ./tests/windows-mcp-config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows MCP configuration checks failed' }
      - name: Build installer
        shell: bash
        run: npm run desktop:build -- --target "$LEAF_BUILD_TARGET" --config "$LEAF_BUILD_CONFIG"
      - name: Verify Windows file integration
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/$env:LEAF_BUILD_TARGET/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer not found' }
          ./tests/windows-i18n-installer.ps1 -Installer $installer.FullName
          ./tests/document-icons-windows.ps1 -Installer $installer.FullName
      - name: Verify macOS file integration
        if: inputs.platform != 'windows'
        shell: bash
        run: node tests/document-icons-package.mjs "src-tauri/target/$LEAF_BUILD_TARGET/release/bundle/macos/Leaf.app"
      - name: Verify actual Windows PDF rendering
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          npm run desktop:build -- --debug --no-bundle --features native-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF probe build failed' }
          python -m pip install pypdf==6.10.0
          if ($LASTEXITCODE -ne 0) { throw 'PDF validation dependency failed' }
          $env:LEAF_NATIVE_SMOKE_EXE = Join-Path $PWD 'src-tauri/target/debug/leaf.exe'
          node tests/windows-native-smoke.mjs --pdf-only
          if ($LASTEXITCODE -ne 0) { throw 'Actual Leaf PDF export failed' }
      - name: Generate checksums
        shell: bash
        run: node scripts/package-checksums.mjs "$LEAF_BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-${{ env.LEAF_BUILD_TARGET }}-${{ steps.source.outputs.sha }}
          path: test-results/packages/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && inputs.platform == 'windows'
        with:
          name: Windows-PDF-${{ steps.source.outputs.sha }}
          path: test-results/windows-pdf/
          if-no-files-found: ignore
          retention-days: 7
